<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Para que se adapte bien en pantallas de celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patria - Inicio</title>

  <style>
    /* Quita los espacios feos que traen los navegadores y cambia la letra */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box; /* Para que los bordes no alteren el tamaño de los elementos */
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Ocupa toda la pantalla y evita que salga la barra de desplazamiento */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* La barra gris de arriba */
    header {
      background-color: #8c8c8c;
      padding: 6px 10px;
    }

    /* Quita los puntos de la lista y pone los botones a lo ancho */
    nav ul {
      list-style: none;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    /* Texto de los botones del menú */
    nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      text-align: center;
      padding: 6px 15px;
      display: block;
    }

    /* Marca cuál opción del menú está seleccionada actualmente */
    nav a.active {
      background-color: #b3b3b3;
      border-radius: 12px;
      padding: 6px 40px;
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.2);
    }

    /* Contenedor que acomoda las 3 franjas lado a lado */
    .flag-container {
      display: flex;
      flex: 1;
      width: 100%;
    }

    /* Hace que cada franja mida exactamente lo mismo de ancho */
    .stripe {
      flex: 1;
      height: 100%;
    }

    /* Color de la primera franja */
    .green {
      background-color: #006847;
    }

    /* Franja central blanca y acomodo del contenido al centro */
    .white {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Para cuando se usan imágenes pequeñas */
    .flag-img {
      max-width: 90px;
      height: auto;
      margin-bottom: 15px;
    }

    /* Tamaño de la fecha del titulo */
    .date-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* Colores para dividir el texto entre verde y rojo */
    .text-green { color: #006847; }
    .text-red { color: #ce1126; }

    /* Estilo del título en letras doradas del titulo */
    .main-title {
      font-family: 'Times New Roman', Times, serif;
      color: #c49219;
      font-size: 32px;
      font-weight: bold;
      text-transform: uppercase;
      line-height: 1.2;
      letter-spacing: 1px;
    }

    /* Franja roja con los datos mandados a la esquina inferior derecha */
    .red {
      background-color: #ce1126;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 20px;
    }

    /* Formato de texto para los datos del alumno */
    .author-info {
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      line-height: 1.4;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Menú de navegación superior -->
  <header>
    <nav>
      <ul>
        <!-- La clase "active" resalta en qué página estás -->
        <li><a href="index.html" class="active">INICIO</a></li>
        <li><a href="fechas.html">FECHAS IMPORTANTES</a></li>
        <li><a href="personajes.html">PERSONAJES ILUSTRADOS</a></li>
        <li><a href="datos.html">DATOS CURIOSOS Y MITOS</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenedor general que simula la bandera -->
  <main class="flag-container">

    <!--  Franja Verde -->
    <section class="stripe green"></section>

    <!--  Franja Blanca con la imagen y los títulos -->
    <section class="stripe white">

      <!-- Imagen del centro -->
      <img src="mexico.png" width="450" height="250" alt="Bandera">

      <!-- Texto de la fecha con colores combinados -->
      <div class="date-title">
        <span class="text-green">16 DE SEPT</span><span class="text-red">IEMBRE</span>
      </div>

      <!-- Título principal -->
      <h1 class="main-title">
        DÍA DE LA<br>INDEPENDENCIA
      </h1>

    </section>

    <!-- Franja Roja con mis datos abajo a la derecha -->
    <section class="stripe red">
      <div class="author-info">
        <p>RAMOS FLORES PEDRO ALEXIS</p>
        <p>5-I</p>
        <p>0643</p>
      </div>
    </section>

  </main>

</body>
</html>
