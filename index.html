<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Patria</title>

  <!-- ESTILOS CSS                                -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Estilos del Encabezado y Menú */
    header {
      background-color: #8c8c8c;
      padding: 6px 10px;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      text-align: center;
      padding: 6px 20px;
      display: block;
      border-radius: 12px;
    }

    nav a:hover, nav a:focus {
      background-color: #b3b3b3;
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.2);
    }

    /* Estilos del Contenedor de Páginas */
    iframe {
      width: 100%;
      height: calc(100vh - 37px);
      border: none;
    }
  </style>
</head>
<body>


  <!-- ENCABEZADO Y MENÚ DE NAVEGACIÓN            -->
  <header>
    <nav>
      <ul>
        <li><a href="inicio.html" target="contenedor">INICIO</a></li>
        <li><a href="fechas.html" target="contenedor">FECHAS IMPORTANTES</a></li>
        <li><a href="personajes.html" target="contenedor">PERSONAJES ILUSTRADOS</a></li>
        <li><a href="datos.html" target="contenedor">DATOS CURIOSOS Y MITOS</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTENEDOR PRINCIPAL  -->
  <iframe name="contenedor" src="inicio.html"></iframe>

</body>
</html>
